name: Signed APK candidates

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or commit)
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: dtv-android-signed-apk-candidates
  cancel-in-progress: false

env:
  NDK_VERSION: "27.0.12077973"
  ANDROID_CMAKE_VERSION: "3.22.1"
  JAVA_VERSION: "17"
  JAVA_RUNTIME_VERSION: "17.0.20.1+1"
  RUST_VERSION: "1.98.1"
  CORE_USERLAND_REF: 67420d1c909e9205841612a186ae4c7fbf4dd092
  CORE_PATCH_SHA256: 9da0cf46a7727a5c7e20de165babd0bc2d78e47c119cad38c1f2c00abeb10521
  ASICEN_USERLAND_REF: e2a86ca194b60f1111ecfa0a020cd0944c351c76
  PIX_USERLAND_REF: 66f5a731784d205d1d306edda9cc57071c087f8e
  PX4_USERLAND_REF: 5c91e8c57b288c0f490061789829e42dbbf61b3d
  SIANO_USERLAND_REF: 33c3468e7e10781ae6c7e9a5fd57a0c1b0825288
  SIANO_PX4_USERLAND_REF: 90b08dfe79b0b40e393f015975c761863830866a
  PX4_BUILD_PATCH_SHA256: ba9c4607e3411e706e537a38cc879990f46db04977ca717e714e0004553a4a42
  PX4_DRV_REF: 2b3f79b5bc5db56e8556bb28397f7d8f74b2adeb

jobs:
  build:
    name: Build unsigned mirakc candidate
    runs-on: ubuntu-latest
    outputs:
      git_head: ${{ steps.resolve-candidate.outputs.git_head }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve candidate commit
        id: resolve-candidate
        run: echo "git_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/dtv-userland-core
          ref: ${{ env.CORE_USERLAND_REF }}
          path: dtv-userland-core
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/asicen-userland
          ref: ${{ env.ASICEN_USERLAND_REF }}
          path: asicen-userland
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/pix-userland
          ref: ${{ env.PIX_USERLAND_REF }}
          path: pix-userland
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/siano-userland
          ref: ${{ env.SIANO_USERLAND_REF }}
          path: siano-userland
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/px4-userland
          ref: ${{ env.PX4_USERLAND_REF }}
          path: px4-userland
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/px4-userland
          ref: ${{ env.SIANO_PX4_USERLAND_REF }}
          path: siano-px4-userland
      - uses: actions/checkout@v5
        with:
          repository: nns779/px4_drv
          ref: ${{ env.PX4_DRV_REF }}
          path: px4_drv
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_RUNTIME_VERSION }}
      - name: Verify exact JDK runtime
        run: |
          set -euo pipefail
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          test "$runtime_version" = "$JAVA_RUNTIME_VERSION"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Device evidence host self-test
        run: tools/mirakc/test-device-evidence.sh
      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install pinned Android CMake and bundled Ninja
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;$ANDROID_CMAKE_VERSION" >/dev/null
          cmake_bin="$ANDROID_SDK_ROOT/cmake/$ANDROID_CMAKE_VERSION/bin"
          test "$("$cmake_bin/cmake" --version | sed -n '1s/^cmake version \([0-9][0-9.]*\).*/\1/p')" = "$ANDROID_CMAKE_VERSION"
          test "$("$cmake_bin/ninja" --version)" = "1.10.2"
          echo "$cmake_bin" >> "$GITHUB_PATH"
      - name: Install Rust Android targets
        run: |
          set -euo pipefail
          rustup show active-toolchain | grep -E "^${RUST_VERSION}(-|$)"
          rustup target add --toolchain "$RUST_VERSION" armv7-linux-androideabi aarch64-linux-android
          rustc --version | grep -E "^rustc ${RUST_VERSION} "
          cargo --version | grep -E "^cargo ${RUST_VERSION} "
      - name: Cache portable aribb24 host tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mirakc-arib-tools
          key: mirakc-arib-autotools-${{ runner.os }}-${{ hashFiles('tools/mirakc-arib/bootstrap-autotools.sh') }}
      - name: Assemble unsigned candidate
        env:
          MIRAKC_ARIB_AUTOTOOLS_ROOT: ${{ runner.temp }}/mirakc-arib-tools
          CARGO_HOME: ${{ runner.temp }}/cargo
          CANDIDATE_REF: ${{ inputs.ref }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CARGO_BUILD_JOBS: "1"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
          PX4_ANDROID_BUILD_JOBS: "1"
        run: |
          set -euo pipefail
          test "$(git -C dtv-userland-core rev-parse HEAD)" = "$CORE_USERLAND_REF"
          test "$(git -C asicen-userland rev-parse HEAD)" = "$ASICEN_USERLAND_REF"
          test "$(git -C pix-userland rev-parse HEAD)" = "$PIX_USERLAND_REF"
          test "$(git -C px4-userland rev-parse HEAD)" = "$PX4_USERLAND_REF"
          test "$(git -C siano-userland rev-parse HEAD)" = "$SIANO_USERLAND_REF"
          test "$(git -C siano-px4-userland rev-parse HEAD)" = "$SIANO_PX4_USERLAND_REF"
          test "$(git -C px4_drv rev-parse HEAD)" = "$PX4_DRV_REF"
          core_patch_sha256="$(sha256sum tools/mirakc/patches/dtv-core-receiver-control-concurrency.patch | awk '{ print $1 }')"
          px4_build_patch_sha256="$(sha256sum tools/mirakc/patches/px4-userland-build-jobs.patch | awk '{ print $1 }')"
          test "$core_patch_sha256" = "$CORE_PATCH_SHA256" \
            || { echo "DTV-owned Core integration patch hash does not match the release pin" >&2; exit 1; }
          test "$px4_build_patch_sha256" = "$PX4_BUILD_PATCH_SHA256" \
            || { echo "DTV-owned PX4 build patch hash does not match the release pin" >&2; exit 1; }
          ./gradlew --no-daemon --max-workers=1 \
            -PuserlandCoreDir="$GITHUB_WORKSPACE/dtv-userland-core" \
            -PasicenUserlandDir="$GITHUB_WORKSPACE/asicen-userland" \
            -PpixUserlandDir="$GITHUB_WORKSPACE/pix-userland" \
            -PsianoUserlandDir="$GITHUB_WORKSPACE/siano-userland" \
            -Ppx4UserlandDir="$GITHUB_WORKSPACE/px4-userland" \
            -PsianoPx4UserlandDir="$GITHUB_WORKSPACE/siano-px4-userland" \
            -Ppx4DrvDir="$GITHUB_WORKSPACE/px4_drv" \
            :mirakc:assembleRelease
          apk=mirakc/build/outputs/apk/release/mirakc-release-unsigned.apk
          [[ -f "$apk" ]] || { echo "Unsigned APK not found: $apk" >&2; exit 1; }
          candidate_head="$(git rev-parse HEAD)"
          tools/mirakc/audit-apk.sh "$apk" "$candidate_head"
          mkdir -p out
          cp "$apk" out/mirakc-unsigned.apk
          {
            echo "kind=candidate"
            echo "candidate_run_id=$CANDIDATE_RUN_ID"
            echo "git_ref=$CANDIDATE_REF"
            echo "git_head=$candidate_head"
            echo "version=$(cat mirakc/VERSION)"
            echo "dtv_userland_core_ref=$CORE_USERLAND_REF"
            echo "dtv_userland_core_patch_sha256=$core_patch_sha256"
            echo "asicen_userland_ref=$ASICEN_USERLAND_REF"
            echo "pix_userland_ref=$PIX_USERLAND_REF"
            echo "px4_userland_ref=$PX4_USERLAND_REF"
            echo "siano_userland_ref=$SIANO_USERLAND_REF"
            echo "siano_px4_userland_ref=$SIANO_PX4_USERLAND_REF"
            echo "px4_drv_ref=$PX4_DRV_REF"
            echo "px4_userland_build_patch_sha256=$px4_build_patch_sha256"
            echo "unsigned_apk_sha256=$(sha256sum "$apk" | awk '{ print $1 }')"
          } > out/CANDIDATE_BUILD_INFO.txt
          python3 tools/mirakc/release-attestation.py verify-unsigned \
            --candidate out/mirakc-unsigned.apk \
            --build-info out/CANDIDATE_BUILD_INFO.txt \
            --expected-version "$(cat mirakc/VERSION)" \
            --expected-head "$candidate_head" \
            --expected-run "$CANDIDATE_RUN_ID" \
            --expected-ref "$CANDIDATE_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: mirakc-unsigned-candidate
          path: out/*
          retention-days: 3

  sign:
    name: Sign and verify mirakc candidate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.git_head }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mirakc-unsigned-candidate
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_RUNTIME_VERSION }}
      - name: Verify exact JDK runtime
        run: |
          set -euo pipefail
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          test "$runtime_version" = "$JAVA_RUNTIME_VERSION"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Decode the production release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "The KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Sign and verify candidate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CANDIDATE_REF: ${{ inputs.ref }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt2 -print | sort -V | tail -n 1)"
          [[ -x "$apksigner" && -x "$aapt2" ]] || { echo "Android build tools not found" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(sed -n 's/^git_head=//p' candidate/CANDIDATE_BUILD_INFO.txt)" \
            || { echo "resolved candidate checkout does not match downloaded build-info" >&2; exit 1; }
          checkout_version="$(cat mirakc/VERSION)"
          candidate_version="$(sed -n 's/^version=//p' candidate/CANDIDATE_BUILD_INFO.txt)"
          test "$candidate_version" = "$checkout_version" \
            || { echo "candidate build-info version does not match the checked-out source" >&2; exit 1; }
          python3 tools/mirakc/release-attestation.py verify-unsigned \
            --candidate candidate/mirakc-unsigned.apk \
            --build-info candidate/CANDIDATE_BUILD_INFO.txt \
            --expected-version "$checkout_version" \
            --expected-head "$(git rev-parse HEAD)" \
            --expected-run "$CANDIDATE_RUN_ID" \
            --expected-ref "$CANDIDATE_REF"
          tools/mirakc/audit-apk.sh candidate/mirakc-unsigned.apk "$(git rev-parse HEAD)"
          IFS=. read -r version_major version_minor version_patch <<<"$checkout_version"
          candidate_version_code=$((version_major * 10000 + version_minor * 100 + version_patch))
          EXPECTED_CERT_SHA256=1fd02c94f29a5756ed1d560ac4ecb6813fa0b2e634473a6f31da210ffd5223c4
          sign_apk() {
            unsigned=$1
            signed=$2
            expected_version=$3
            expected_code=$4
            metadata="$("$aapt2" dump badging "$unsigned" | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p")"
            read -r package_name version_code version <<<"$metadata"
            [[ "$package_name" == dev.khronos31.mirakc && "$version" == "$expected_version" && "$version_code" == "$expected_code" ]] \
              || { echo "Unexpected unsigned APK metadata: $metadata" >&2; exit 1; }
            "$apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
              --ks-pass "env:KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" \
              --key-pass "env:KEY_PASSWORD" --out "$signed" "$unsigned"
            "$apksigner" verify --print-certs "$signed" >&2
            cert_sha256="$("$apksigner" verify --print-certs "$signed" \
              | awk -F': ' '/certificate SHA-256 digest/ { print $NF; exit }')"
            [[ "$cert_sha256" == "$EXPECTED_CERT_SHA256" ]] \
              || { echo "Unexpected mirakc signing certificate: $cert_sha256" >&2; exit 1; }
            signed_metadata="$("$aapt2" dump badging "$signed" | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p")"
            read -r signed_package signed_code signed_version <<<"$signed_metadata"
            [[ "$signed_package" == dev.khronos31.mirakc && "$signed_version" == "$expected_version" && "$signed_code" == "$expected_code" ]] \
              || { echo "Signed APK metadata changed: $signed_metadata" >&2; exit 1; }
            printf '%s' "$cert_sha256"
          }
          candidate_cert="$(sign_apk candidate/mirakc-unsigned.apk "$RUNNER_TEMP/mirakc-signed-candidate.apk" "$checkout_version" "$candidate_version_code")"
          mkdir -p out
          cp "$RUNNER_TEMP/mirakc-signed-candidate.apk" out/mirakc-signed-candidate.apk
          (cd out && sha256sum mirakc-signed-candidate.apk > SHA256SUMS)
          {
            cp candidate/CANDIDATE_BUILD_INFO.txt out/CANDIDATE_BUILD_INFO.txt
            python3 - \
              candidate/CANDIDATE_BUILD_INFO.txt \
              "$candidate_cert" \
              "$(sha256sum "$RUNNER_TEMP/mirakc-signed-candidate.apk" | awk '{ print $1 }')" \
              "$checkout_version" \
              > out/BUILD_INFO.json <<'PY'
          import json
          import sys

          def read_info(path):
              values = {}
              for line in open(path, encoding="utf-8"):
                  key, separator, value = line.rstrip("\n").partition("=")
                  if not separator or not key or key in values:
                      raise SystemExit(f"invalid build info: {path}")
                  values[key] = value
              return values

          candidate = read_info(sys.argv[1])
          expected_cert = "1fd02c94f29a5756ed1d560ac4ecb6813fa0b2e634473a6f31da210ffd5223c4"
          if candidate.get("kind") != "candidate" or candidate.get("version") != sys.argv[4]:
              raise SystemExit("candidate build-info changed during signing")
          if sys.argv[2] != expected_cert:
              raise SystemExit("signed certificate is not the production certificate")
          digest = sys.argv[3]
          if len(digest) != 64 or any(character not in "0123456789abcdef" for character in digest):
              raise SystemExit("signed APK digest is not a lowercase SHA-256")
          json.dump({
              "schema": 1,
              "candidate": {
                  "build": candidate,
                  "signed_apk_sha256": digest,
                  "certificate_sha256": sys.argv[2],
              },
          }, sys.stdout, sort_keys=True, indent=2)
          sys.stdout.write("\n")
          PY
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mirakc-signed-candidate
          path: out/*
          retention-days: 3

  epgstation-build:
    name: Build unsigned EPGStation candidate
    runs-on: ubuntu-latest
    outputs:
      git_head: ${{ steps.resolve-candidate.outputs.git_head }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve candidate commit
        id: resolve-candidate
        run: echo "git_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Verify exact JDK runtime
        run: |
          set -euo pipefail
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          test "$runtime_version" = "$JAVA_RUNTIME_VERSION"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the pinned NDK and host tools
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y patchelf
      - name: Assemble unsigned EPGStation candidate
        env:
          CANDIDATE_REF: ${{ inputs.ref }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(cat epgstation-server/VERSION)" = "0.4.1" \
            || { echo "candidate build requires EPGStation 0.4.1" >&2; exit 1; }
          ./gradlew --no-daemon :epgstation-server:assembleRelease
          apk=epgstation-server/build/outputs/apk/release/epgstation-server-release-unsigned.apk
          [[ -f "$apk" ]] || { echo "Unsigned EPGStation APK not found: $apk" >&2; exit 1; }
          python3 tools/scripts/release_version.py check --component epgstation-server --apk "$apk"
          mkdir -p out
          cp "$apk" out/epgstation-server-unsigned.apk
          {
            echo "kind=candidate"
            echo "component=epgstation-server"
            echo "candidate_run_id=$CANDIDATE_RUN_ID"
            echo "git_ref=$CANDIDATE_REF"
            echo "git_head=$(git rev-parse HEAD)"
            echo "version=$(cat epgstation-server/VERSION)"
            echo "unsigned_apk_sha256=$(sha256sum "$apk" | awk '{ print $1 }')"
          } > out/EPGSTATION_CANDIDATE_BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: epgstation-server-unsigned-candidate
          path: out/*
          retention-days: 3

  epgstation-sign:
    name: Sign and verify EPGStation candidate
    needs: epgstation-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.epgstation-build.outputs.git_head }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: epgstation-server-unsigned-candidate
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Verify exact JDK runtime
        run: |
          set -euo pipefail
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          test "$runtime_version" = "$JAVA_RUNTIME_VERSION"
      - name: Decode the production release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "The KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Sign and verify EPGStation candidate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt2 -print | sort -V | tail -n 1)"
          [[ -x "$apksigner" && -x "$aapt2" ]] || { echo "Android build tools not found" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(sed -n 's/^git_head=//p' candidate/EPGSTATION_CANDIDATE_BUILD_INFO.txt)" \
            || { echo "resolved candidate checkout does not match downloaded build-info" >&2; exit 1; }
          test "$(sed -n 's/^kind=//p' candidate/EPGSTATION_CANDIDATE_BUILD_INFO.txt)" = candidate
          test "$(sed -n 's/^component=//p' candidate/EPGSTATION_CANDIDATE_BUILD_INFO.txt)" = epgstation-server
          test "$(sed -n 's/^version=//p' candidate/EPGSTATION_CANDIDATE_BUILD_INFO.txt)" = 0.4.1
          test "$(sed -n 's/^unsigned_apk_sha256=//p' candidate/EPGSTATION_CANDIDATE_BUILD_INFO.txt)" = \
            "$(sha256sum candidate/epgstation-server-unsigned.apk | awk '{ print $1 }')"
          expected_cert=1fd02c94f29a5756ed1d560ac4ecb6813fa0b2e634473a6f31da210ffd5223c4
          metadata="$($aapt2 dump badging candidate/epgstation-server-unsigned.apk | sed -n "s/^package: name='\\([^']*\\)' versionCode='\\([^']*\\)' versionName='\\([^']*\\)'.*/\\1 \\2 \\3/p")"
          test "$metadata" = "dev.khronos31.epgstation.server 401 0.4.1"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "env:KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" --out "$RUNNER_TEMP/epgstation-server-signed.apk" \
            candidate/epgstation-server-unsigned.apk
          "$apksigner" verify --print-certs "$RUNNER_TEMP/epgstation-server-signed.apk" >&2
          cert_sha256="$("$apksigner" verify --print-certs "$RUNNER_TEMP/epgstation-server-signed.apk" \
            | awk -F': ' '/certificate SHA-256 digest/ { print $NF; exit }' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$cert_sha256" = "$expected_cert" || { echo "Unexpected EPGStation signing certificate: $cert_sha256" >&2; exit 1; }
          signed_metadata="$($aapt2 dump badging "$RUNNER_TEMP/epgstation-server-signed.apk" | sed -n "s/^package: name='\\([^']*\\)' versionCode='\\([^']*\\)' versionName='\\([^']*\\)'.*/\\1 \\2 \\3/p")"
          test "$signed_metadata" = "dev.khronos31.epgstation.server 401 0.4.1"
          mkdir -p out
          cp "$RUNNER_TEMP/epgstation-server-signed.apk" out/epgstation-server-signed-candidate.apk
          cp candidate/EPGSTATION_CANDIDATE_BUILD_INFO.txt out/EPGSTATION_CANDIDATE_BUILD_INFO.txt
          signed_sha256="$(sha256sum out/epgstation-server-signed-candidate.apk | awk '{ print $1 }')"
          printf '{\n  "schema": 1,\n  "component": "epgstation-server",\n  "version": "0.4.1",\n  "git_head": "%s",\n  "candidate_run_id": "%s",\n  "unsigned_apk_sha256": "%s",\n  "signed_apk_sha256": "%s",\n  "certificate_sha256": "%s"\n}\n' \
            "$(sed -n 's/^git_head=//p' candidate/EPGSTATION_CANDIDATE_BUILD_INFO.txt)" \
            "$(sed -n 's/^candidate_run_id=//p' candidate/EPGSTATION_CANDIDATE_BUILD_INFO.txt)" \
            "$(sed -n 's/^unsigned_apk_sha256=//p' candidate/EPGSTATION_CANDIDATE_BUILD_INFO.txt)" \
            "$signed_sha256" "$cert_sha256" > out/EPGSTATION_BUILD_INFO.json
          (cd out && sha256sum \
            epgstation-server-signed-candidate.apk \
            EPGSTATION_CANDIDATE_BUILD_INFO.txt \
            EPGSTATION_BUILD_INFO.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: epgstation-server-signed-candidate
          path: out/*
          retention-days: 3
