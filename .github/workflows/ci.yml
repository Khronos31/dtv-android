name: CI

on:
  push:
  pull_request:

env:
  # Pinned so that a runner image refresh cannot change what ships in the APK.
  NDK_VERSION: "27.0.12077973"
  SIANO_USERLAND_REF: d4f8930ab56d13c479037f2e242461062d96c127
  PX4_USERLAND_REF: 639e65feee7c9f503d44023edd9ab9bba12d5d74
  PX4_DRV_REF: 2b3f79b5bc5db56e8556bb28397f7d8f74b2adeb

jobs:
  version:
    name: Version metadata (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [mirakc, epgstation-server]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check version metadata
        run: python3 tools/scripts/release_version.py check --component "${{ matrix.component }}"

  mirakc:
    name: mirakc APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/siano-userland
          ref: ${{ env.SIANO_USERLAND_REF }}
          path: siano-userland
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/px4-userland
          ref: ${{ env.PX4_USERLAND_REF }}
          path: px4-userland
      - uses: actions/checkout@v5
        with:
          repository: nns779/px4_drv
          ref: ${{ env.PX4_DRV_REF }}
          path: px4_drv
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install Rust Android targets
        run: rustup target add armv7-linux-androideabi aarch64-linux-android
      - name: Cache portable aribb24 host tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mirakc-arib-tools
          key: mirakc-arib-autotools-${{ runner.os }}-${{ hashFiles('tools/mirakc-arib/bootstrap-autotools.sh') }}
      - name: Build
        env:
          MIRAKC_ARIB_AUTOTOOLS_ROOT: ${{ runner.temp }}/mirakc-arib-tools
          CARGO_HOME: ${{ runner.temp }}/cargo
        run: |
          ./gradlew --no-daemon \
            -PsianoUserlandDir="$GITHUB_WORKSPACE/siano-userland" \
            -Ppx4UserlandDir="$GITHUB_WORKSPACE/px4-userland" \
            -Ppx4DrvDir="$GITHUB_WORKSPACE/px4_drv" \
            :mirakc:assembleDebug
      - name: Verify the APK carries its module version
        run: |
          python3 tools/scripts/release_version.py check --component mirakc \
            --apk mirakc/build/outputs/apk/debug/mirakc-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mirakc-debug-apk
          path: mirakc/build/outputs/apk/debug/mirakc-debug.apk

  epgstation-server:
    name: EPGStation Server APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew --no-daemon :epgstation-server:assembleDebug
      - name: Verify the APK carries its module version
        run: |
          python3 tools/scripts/release_version.py check --component epgstation-server \
            --apk epgstation-server/build/outputs/apk/debug/epgstation-server-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: epgstation-server-debug-apk
          path: epgstation-server/build/outputs/apk/debug/epgstation-server-debug.apk
