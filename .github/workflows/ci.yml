name: CI

on:
  push:
  pull_request:

env:
  # Pinned so that a runner image refresh cannot change what ships in the APK.
  NDK_VERSION: "27.0.12077973"
  ANDROID_CMAKE_VERSION: "3.22.1"
  JAVA_VERSION: "17"
  JAVA_RUNTIME_VERSION: "17.0.20.1+1"
  RUST_VERSION: "1.98.1"
  SIANO_USERLAND_REF: d4f8930ab56d13c479037f2e242461062d96c127
  PX4_USERLAND_REF: 639e65feee7c9f503d44023edd9ab9bba12d5d74
  PX4_DRV_REF: 2b3f79b5bc5db56e8556bb28397f7d8f74b2adeb

jobs:
  version:
    name: Version metadata (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [mirakc, epgstation-server]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check version metadata
        run: python3 tools/scripts/release_version.py check --component "${{ matrix.component }}"

  mirakc:
    name: mirakc APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/siano-userland
          ref: ${{ env.SIANO_USERLAND_REF }}
          path: siano-userland
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/px4-userland
          ref: ${{ env.PX4_USERLAND_REF }}
          path: px4-userland
      - uses: actions/checkout@v5
        with:
          repository: nns779/px4_drv
          ref: ${{ env.PX4_DRV_REF }}
          path: px4_drv
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Verify exact JDK runtime
        run: |
          set -euo pipefail
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          test "$runtime_version" = "$JAVA_RUNTIME_VERSION"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install pinned Android CMake and bundled Ninja
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;$ANDROID_CMAKE_VERSION" >/dev/null
          cmake_bin="$ANDROID_SDK_ROOT/cmake/$ANDROID_CMAKE_VERSION/bin"
          test "$("$cmake_bin/cmake" --version | sed -n '1s/^cmake version \([0-9][0-9.]*\).*/\1/p')" = "$ANDROID_CMAKE_VERSION"
          test "$("$cmake_bin/ninja" --version)" = "1.10.2"
          echo "$cmake_bin" >> "$GITHUB_PATH"
      - name: Install Rust Android targets
        run: |
          set -euo pipefail
          rustup show active-toolchain | grep -E "^${RUST_VERSION}(-|$)"
          rustup target add --toolchain "$RUST_VERSION" armv7-linux-androideabi aarch64-linux-android
          rustc --version | grep -E "^rustc ${RUST_VERSION} "
          cargo --version | grep -E "^cargo ${RUST_VERSION} "
      - name: Cache portable aribb24 host tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mirakc-arib-tools
          key: mirakc-arib-autotools-${{ runner.os }}-${{ hashFiles('tools/mirakc-arib/bootstrap-autotools.sh') }}
      - name: Test and lint
        env:
          MIRAKC_ARIB_AUTOTOOLS_ROOT: ${{ runner.temp }}/mirakc-arib-tools
          CARGO_HOME: ${{ runner.temp }}/cargo
        run: |
          ./gradlew --no-daemon \
            -PsianoUserlandDir="$GITHUB_WORKSPACE/siano-userland" \
            -Ppx4UserlandDir="$GITHUB_WORKSPACE/px4-userland" \
            -Ppx4DrvDir="$GITHUB_WORKSPACE/px4_drv" \
            test :mirakc:lintDebug
      - name: Assemble debug
        env:
          MIRAKC_ARIB_AUTOTOOLS_ROOT: ${{ runner.temp }}/mirakc-arib-tools
          CARGO_HOME: ${{ runner.temp }}/cargo
        run: |
          ./gradlew --no-daemon \
            -PsianoUserlandDir="$GITHUB_WORKSPACE/siano-userland" \
            -Ppx4UserlandDir="$GITHUB_WORKSPACE/px4-userland" \
            -Ppx4DrvDir="$GITHUB_WORKSPACE/px4_drv" \
            :mirakc:assembleDebug
      - name: Cache pinned Swagger UI source archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mirakc-dependencies"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/mirakc-dependencies/swagger-ui-5.17.14.zip" \
            https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.17.14.zip
          printf '%s  %s\n' \
            481244d0812097b11fbaeef79f71d942b171617f9c9f9514e63acbe13e71ccdc \
            "$RUNNER_TEMP/mirakc-dependencies/swagger-ui-5.17.14.zip" \
            | sha256sum -c -
      - name: Verify corresponding-source archive offline Cargo proof
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo
          MIRAKC_TEST_MIRAKC_ROOT: ${{ github.workspace }}/.work/mirakc-3.4.86
          MIRAKC_TEST_ARIB_ROOT: ${{ github.workspace }}/.work/mirakc-arib-0.24.38
          MIRAKC_TEST_SIANO_ROOT: ${{ github.workspace }}/siano-userland
          MIRAKC_TEST_PX4_ROOT: ${{ github.workspace }}/px4-userland
          MIRAKC_TEST_PX4_DRV_ROOT: ${{ github.workspace }}/px4_drv
          MIRAKC_TEST_LIBUSB_ARCHIVE: ${{ github.workspace }}/siano-userland/build/android-aarch64/src/libusb-1.0.30.tar.bz2
          MIRAKC_TEST_SWAGGER_UI_ARCHIVE: ${{ runner.temp }}/mirakc-dependencies/swagger-ui-5.17.14.zip
          MIRAKC_TEST_AUTOTOOLS_CACHE: ${{ runner.temp }}/mirakc-arib-tools/autotools-sources
          MIRAKC_TEST_ARCHIVE_OUTPUT: ${{ runner.temp }}/mirakc-corresponding-source.tar.gz
        run: tools/mirakc/test-source-package.sh
      - name: Clean-room complete native inventory and relink proof
        env:
          MIRAKC_REQUIRE_NETWORK_NAMESPACE: required
        run: >-
          tools/mirakc/test-source-native-rebuild.sh
          "$RUNNER_TEMP/mirakc-corresponding-source.tar.gz"
          "$GITHUB_WORKSPACE/mirakc/build/outputs/apk/debug/mirakc-debug.apk"
      - name: Audit APK native and source metadata
        run: tools/mirakc/audit-apk.sh mirakc/build/outputs/apk/debug/mirakc-debug.apk "$GITHUB_SHA"
      - name: Verify the APK carries its module version
        run: |
          python3 tools/scripts/release_version.py check --component mirakc \
            --apk mirakc/build/outputs/apk/debug/mirakc-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mirakc-debug-apk
          path: mirakc/build/outputs/apk/debug/mirakc-debug.apk

  epgstation-server:
    name: EPGStation Server APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Verify exact JDK runtime
        run: |
          set -euo pipefail
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          test "$runtime_version" = "$JAVA_RUNTIME_VERSION"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew --no-daemon :epgstation-server:assembleDebug
      - name: Verify the APK carries its module version
        run: |
          python3 tools/scripts/release_version.py check --component epgstation-server \
            --apk epgstation-server/build/outputs/apk/debug/epgstation-server-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: epgstation-server-debug-apk
          path: epgstation-server/build/outputs/apk/debug/epgstation-server-debug.apk
