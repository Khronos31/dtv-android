name: CI

on:
  push:
  pull_request:

env:
  # Pinned so that a runner image refresh cannot change what ships in the APK.
  NDK_VERSION: "27.0.12077973"
  ANDROID_CMAKE_VERSION: "3.22.1"
  JAVA_VERSION: "17.0.20"
  JAVA_RUNTIME_VERSION: "17.0.20.1+1"
  JAVA_ARCHIVE_URL: "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz"
  JAVA_ARCHIVE_SHA256: "3808d1d15e3ec6bd5b84057fb5d84c33d8a1536a258146bcea2e603fc726e08e"
  RUST_VERSION: "1.98.1"
  SIANO_USERLAND_REF: 33c3468e7e10781ae6c7e9a5fd57a0c1b0825288
  PX4_USERLAND_REF: 5c91e8c57b288c0f490061789829e42dbbf61b3d
  ASICEN_USERLAND_REF: e2a86ca194b60f1111ecfa0a020cd0944c351c76
  PIX_USERLAND_REF: 66f5a731784d205d1d306edda9cc57071c087f8e
  DTV_USERLAND_CORE_REF: 67420d1c909e9205841612a186ae4c7fbf4dd092
  SIANO_PX4_USERLAND_REF: 90b08dfe79b0b40e393f015975c761863830866a
  PX4_DRV_REF: 2b3f79b5bc5db56e8556bb28397f7d8f74b2adeb
  CARGO_BUILD_JOBS: "1"

jobs:
  version:
    name: Version metadata (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [mirakc, epgstation-server]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check version metadata
        run: python3 tools/scripts/release_version.py check --component "${{ matrix.component }}"

  mirakc:
    name: mirakc APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/siano-userland
          ref: ${{ env.SIANO_USERLAND_REF }}
          path: siano-userland
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/px4-userland
          ref: ${{ env.PX4_USERLAND_REF }}
          path: px4-userland
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/asicen-userland
          ref: ${{ env.ASICEN_USERLAND_REF }}
          path: asicen-userland
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/pix-userland
          ref: ${{ env.PIX_USERLAND_REF }}
          path: pix-userland
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/dtv-userland-core
          ref: ${{ env.DTV_USERLAND_CORE_REF }}
          path: dtv-userland-core
      - uses: actions/checkout@v5
        with:
          repository: Khronos31/px4-userland
          ref: ${{ env.SIANO_PX4_USERLAND_REF }}
          path: siano-px4-userland
      - uses: actions/checkout@v5
        with:
          repository: nns779/px4_drv
          ref: ${{ env.PX4_DRV_REF }}
          path: px4_drv
      - name: Download and verify the pinned Temurin JDK
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/temurin-jdk.tar.gz"
          curl --fail --location --retry 3 "$JAVA_ARCHIVE_URL" --output "$archive"
          printf '%s  %s\n' "$JAVA_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
      - uses: actions/setup-java@v5
        with:
          distribution: jdkfile
          java-version: ${{ env.JAVA_VERSION }}
          jdkFile: ${{ runner.temp }}/temurin-jdk.tar.gz
          architecture: x64
      - name: Verify exact JDK runtime
        run: |
          set -euo pipefail
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          test "$runtime_version" = "$JAVA_RUNTIME_VERSION"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Device evidence host self-test
        run: tools/mirakc/test-device-evidence.sh
      - name: Shared JNI process launcher host self-test
        run: sh tools/mirakc/test-userland-process-launch.sh
      - name: Cargo registry and Git vendor provenance fixtures
        run: python3 tools/mirakc/test-cargo-vendor.py
      - name: Release attestation host self-test
        run: tools/mirakc/test-release-attestation.sh
      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install pinned Android CMake and bundled Ninja
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;$ANDROID_CMAKE_VERSION" >/dev/null
          cmake_bin="$ANDROID_SDK_ROOT/cmake/$ANDROID_CMAKE_VERSION/bin"
          test "$("$cmake_bin/cmake" --version | sed -n '1s/^cmake version \([0-9][0-9.]*\).*/\1/p')" = "$ANDROID_CMAKE_VERSION"
          test "$("$cmake_bin/ninja" --version)" = "1.10.2"
          echo "$cmake_bin" >> "$GITHUB_PATH"
      - name: Install libusb development files for PIX CMake fixture
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libusb-1.0-0-dev
      - name: PIX source revision override fixture
        env:
          MIRAKC_TEST_PIX_ROOT: ${{ github.workspace }}/pix-userland
          MIRAKC_TEST_CORE_ROOT: ${{ github.workspace }}/dtv-userland-core
        run: python3 tools/mirakc/test-pix-source-revision.py
      - name: Debug DTV deletion input fixture
        run: tools/mirakc/test-debug-dtv-deletion-input.sh
      - name: Custom adapter Gradle task input fixture
        run: sh tools/mirakc/test-adapter-task-inputs.sh
      - name: Native rebuild helper ABI scope fixture
        run: sh tools/mirakc/test-source-native-helper-scope.sh
      - name: Install Rust Android targets
        run: |
          set -euo pipefail
          rustup show active-toolchain | grep -E "^${RUST_VERSION}(-|$)"
          rustup target add --toolchain "$RUST_VERSION" armv7-linux-androideabi aarch64-linux-android
          rustc --version | grep -E "^rustc ${RUST_VERSION} "
          cargo --version | grep -E "^cargo ${RUST_VERSION} "
      - name: Cache portable aribb24 host tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mirakc-arib-tools
          key: mirakc-arib-autotools-${{ runner.os }}-${{ hashFiles('tools/mirakc-arib/bootstrap-autotools.sh') }}
      - name: Test and lint
        env:
          MIRAKC_ARIB_AUTOTOOLS_ROOT: ${{ runner.temp }}/mirakc-arib-tools
          CARGO_HOME: ${{ runner.temp }}/cargo
        run: |
          ./gradlew --no-daemon --max-workers=1 \
            -PsianoUserlandDir="$GITHUB_WORKSPACE/siano-userland" \
            -Ppx4UserlandDir="$GITHUB_WORKSPACE/px4-userland" \
            -PasicenUserlandDir="$GITHUB_WORKSPACE/asicen-userland" \
            -PpixUserlandDir="$GITHUB_WORKSPACE/pix-userland" \
            -PuserlandCoreDir="$GITHUB_WORKSPACE/dtv-userland-core" \
            -PsianoPx4UserlandDir="$GITHUB_WORKSPACE/siano-px4-userland" \
            -PlibusbArchive="$GITHUB_WORKSPACE/.work/libusb-1.0.30.tar.bz2" \
            -PlibusbSourceDir="$GITHUB_WORKSPACE/.work/libusb-1.0.30" \
            -Ppx4DrvDir="$GITHUB_WORKSPACE/px4_drv" \
            :mirakc:test :mirakc-ui-contract:test :updater:test :mirakc:lintDebug
      - name: Test CCID log redaction
        run: bash tools/mirakc/test-ccid-log-redaction.sh
      - name: Assemble debug
        env:
          MIRAKC_ARIB_AUTOTOOLS_ROOT: ${{ runner.temp }}/mirakc-arib-tools
          CARGO_HOME: ${{ runner.temp }}/cargo
        run: |
          ./gradlew --no-daemon --max-workers=1 \
            -PsianoUserlandDir="$GITHUB_WORKSPACE/siano-userland" \
            -Ppx4UserlandDir="$GITHUB_WORKSPACE/px4-userland" \
            -PasicenUserlandDir="$GITHUB_WORKSPACE/asicen-userland" \
            -PpixUserlandDir="$GITHUB_WORKSPACE/pix-userland" \
            -PuserlandCoreDir="$GITHUB_WORKSPACE/dtv-userland-core" \
            -PsianoPx4UserlandDir="$GITHUB_WORKSPACE/siano-px4-userland" \
            -PlibusbArchive="$GITHUB_WORKSPACE/.work/libusb-1.0.30.tar.bz2" \
            -PlibusbSourceDir="$GITHUB_WORKSPACE/.work/libusb-1.0.30" \
            -Ppx4DrvDir="$GITHUB_WORKSPACE/px4_drv" \
            :mirakc:assembleDebug
      - name: Cache pinned Swagger UI source archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mirakc-dependencies"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/mirakc-dependencies/swagger-ui-5.32.6.zip" \
            https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.32.6.zip
          printf '%s  %s\n' \
            b3c07e091559b59a833f66547eb1fc18f2896f96e3f1f953e2f1efb328aa3394 \
            "$RUNNER_TEMP/mirakc-dependencies/swagger-ui-5.32.6.zip" \
            | sha256sum -c -
      - name: Verify corresponding-source archive offline Cargo proof
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo
          MIRAKC_TEST_MIRAKC_ROOT: ${{ github.workspace }}/.work/mirakc-3.4.91
          MIRAKC_TEST_ARIB_ROOT: ${{ github.workspace }}/.work/mirakc-arib-0.24.40
          MIRAKC_TEST_SIANO_ROOT: ${{ github.workspace }}/siano-userland
          MIRAKC_TEST_PX4_ROOT: ${{ github.workspace }}/px4-userland
          MIRAKC_TEST_ASICEN_ROOT: ${{ github.workspace }}/asicen-userland
          MIRAKC_TEST_PIX_ROOT: ${{ github.workspace }}/pix-userland
          MIRAKC_TEST_CORE_ROOT: ${{ github.workspace }}/dtv-userland-core
          MIRAKC_TEST_SIANO_PX4_ROOT: ${{ github.workspace }}/siano-px4-userland
          MIRAKC_TEST_PX4_DRV_ROOT: ${{ github.workspace }}/px4_drv
          MIRAKC_TEST_LIBUSB_ARCHIVE: ${{ github.workspace }}/.work/libusb-1.0.30.tar.bz2
          MIRAKC_TEST_SWAGGER_UI_ARCHIVE: ${{ runner.temp }}/mirakc-dependencies/swagger-ui-5.32.6.zip
          MIRAKC_TEST_AUTOTOOLS_CACHE: ${{ runner.temp }}/mirakc-arib-tools/autotools-sources
          MIRAKC_TEST_ARCHIVE_OUTPUT: ${{ runner.temp }}/mirakc-fixture-source.tar.gz
        run: tools/mirakc/test-source-package.sh
      - name: Build and audit corresponding source for checked-out commit
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo
        run: |
          set -euo pipefail
          python3 tools/mirakc/package-source.py \
            --output-dir "$RUNNER_TEMP" \
            --dtv-root "$GITHUB_WORKSPACE" \
            --dtv-ref HEAD \
            --mirakc-root "$GITHUB_WORKSPACE/.work/mirakc-3.4.91" \
            --arib-root "$GITHUB_WORKSPACE/.work/mirakc-arib-0.24.40" \
            --siano-root "$GITHUB_WORKSPACE/siano-userland" \
            --px4-root "$GITHUB_WORKSPACE/px4-userland" \
            --asicen-root "$GITHUB_WORKSPACE/asicen-userland" \
            --pix-root "$GITHUB_WORKSPACE/pix-userland" \
            --core-root "$GITHUB_WORKSPACE/dtv-userland-core" \
            --siano-px4-root "$GITHUB_WORKSPACE/siano-px4-userland" \
            --px4-drv-root "$GITHUB_WORKSPACE/px4_drv" \
            --libusb-archive "$GITHUB_WORKSPACE/.work/libusb-1.0.30.tar.bz2" \
            --swagger-ui-archive "$RUNNER_TEMP/mirakc-dependencies/swagger-ui-5.32.6.zip" \
            --autotools-cache "$RUNNER_TEMP/mirakc-arib-tools/autotools-sources"
          python3 tools/mirakc/audit-source.py \
            --expected-dtv-commit "$(git rev-parse HEAD)" \
            "$RUNNER_TEMP/mirakc-corresponding-source.tar.gz"
      - name: Clean-room complete native inventory and relink proof
        env:
          MIRAKC_REQUIRE_NETWORK_NAMESPACE: required
        run: >-
          tools/mirakc/test-source-native-rebuild.sh
          "$RUNNER_TEMP/mirakc-corresponding-source.tar.gz"
          "$GITHUB_WORKSPACE/mirakc/build/outputs/apk/debug/mirakc-debug.apk"
      - name: Test APK source metadata with pinned source fixtures
        env:
          MIRAKC_TEST_MIRAKC_ROOT: ${{ github.workspace }}/.work/mirakc-3.4.91
          MIRAKC_TEST_ARIB_ROOT: ${{ github.workspace }}/.work/mirakc-arib-0.24.40
          MIRAKC_TEST_SIANO_ROOT: ${{ github.workspace }}/siano-userland
          MIRAKC_TEST_PX4_ROOT: ${{ github.workspace }}/px4-userland
          MIRAKC_TEST_ASICEN_ROOT: ${{ github.workspace }}/asicen-userland
          MIRAKC_TEST_PIX_ROOT: ${{ github.workspace }}/pix-userland
          MIRAKC_TEST_CORE_ROOT: ${{ github.workspace }}/dtv-userland-core
          MIRAKC_TEST_SIANO_PX4_ROOT: ${{ github.workspace }}/siano-px4-userland
          MIRAKC_TEST_PX4_DRV_ROOT: ${{ github.workspace }}/px4_drv
          MIRAKC_TEST_LIBUSB_ARCHIVE: ${{ github.workspace }}/.work/libusb-1.0.30.tar.bz2
        run: tools/mirakc/test-apk-metadata.sh
      - name: Audit APK native and source metadata
        run: tools/mirakc/audit-apk.sh mirakc/build/outputs/apk/debug/mirakc-debug.apk "$GITHUB_SHA"
      - name: Verify the APK carries its module version
        run: |
          python3 tools/scripts/release_version.py check --component mirakc \
            --apk mirakc/build/outputs/apk/debug/mirakc-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mirakc-corresponding-source
          path: ${{ runner.temp }}/mirakc-corresponding-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mirakc-debug-apk
          path: mirakc/build/outputs/apk/debug/mirakc-debug.apk

  epgstation-server:
    name: EPGStation Server APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download and verify the pinned Temurin JDK
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/temurin-jdk.tar.gz"
          curl --fail --location --retry 3 "$JAVA_ARCHIVE_URL" --output "$archive"
          printf '%s  %s\n' "$JAVA_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
      - uses: actions/setup-java@v5
        with:
          distribution: jdkfile
          java-version: ${{ env.JAVA_VERSION }}
          jdkFile: ${{ runner.temp }}/temurin-jdk.tar.gz
          architecture: x64
      - name: Verify exact JDK runtime
        run: |
          set -euo pipefail
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          test "$runtime_version" = "$JAVA_RUNTIME_VERSION"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build
        run: |
          ./gradlew --no-daemon \
            :epgstation-ui-contract:test \
            :epgstation-server:testDebugUnitTest \
            :epgstation-server:lintDebug \
            :epgstation-server:assembleDebug
      - name: Verify the APK carries its module version
        run: |
          python3 tools/scripts/release_version.py check --component epgstation-server \
            --apk epgstation-server/build/outputs/apk/debug/epgstation-server-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: epgstation-server-debug-apk
          path: epgstation-server/build/outputs/apk/debug/epgstation-server-debug.apk
