name: Release

on:
  push:
    tags:
      - "mirakc-v*"
      - "epgstation-server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact component release tag (for example, mirakc-v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dtv-android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NDK_VERSION: "27.0.12077973"
  ANDROID_CMAKE_VERSION: "3.22.1"
  JAVA_VERSION: "17.0.20.1"
  JAVA_RUNTIME_VERSION: "17.0.20.1+1"
  RUST_VERSION: "1.98.1"
  SIANO_USERLAND_REF: d4f8930ab56d13c479037f2e242461062d96c127
  PX4_USERLAND_REF: 639e65feee7c9f503d44023edd9ab9bba12d5d74
  PX4_DRV_REF: 2b3f79b5bc5db56e8556bb28397f7d8f74b2adeb
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      component: ${{ steps.prepare.outputs.component }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate tag and module version
        id: prepare
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          case "$tag" in
            mirakc-v*) component=mirakc; version="${tag:8}" ;;
            epgstation-server-v*) component=epgstation-server; version="${tag:19}" ;;
            *) echo "Unsupported release tag: $tag" >&2; exit 1 ;;
          esac
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must end in a semantic version" >&2
            exit 1
          fi
          python3 tools/scripts/release_version.py check --component "$component" --tag "$tag"

          git fetch --force origin --tags
          previous="$(git tag --list "${component}-v*" --sort=-version:refname \
            | grep -E "^${component}-v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$" \
            | grep -Fxv "$tag" | head -n 1 || true)"
          if [[ -n "$previous" ]]; then
            previous_version="${previous#"$component-v"}"
            newest="$(printf '%s\n%s\n' "$previous_version" "$version" | sort -V | tail -n 1)"
            if [[ "$newest" != "$version" ]]; then
              echo "$tag is not newer than $previous" >&2
              exit 1
            fi
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $tag" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "component=$component"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.prepare.outputs.component }} APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/checkout@v5
        if: needs.prepare.outputs.component == 'mirakc'
        with:
          repository: Khronos31/siano-userland
          ref: ${{ env.SIANO_USERLAND_REF }}
          path: siano-userland
      - uses: actions/checkout@v5
        if: needs.prepare.outputs.component == 'mirakc'
        with:
          repository: Khronos31/px4-userland
          ref: ${{ env.PX4_USERLAND_REF }}
          path: px4-userland
      - uses: actions/checkout@v5
        if: needs.prepare.outputs.component == 'mirakc'
        with:
          repository: nns779/px4_drv
          ref: ${{ env.PX4_DRV_REF }}
          path: px4_drv
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Verify exact JDK runtime
        run: |
          set -euo pipefail
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          test "$runtime_version" = "$JAVA_RUNTIME_VERSION"
      - uses: actions/setup-node@v5
        if: needs.prepare.outputs.component == 'epgstation-server'
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Host tools for EPGStation
        if: needs.prepare.outputs.component == 'epgstation-server'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install pinned Android CMake and bundled Ninja
        if: needs.prepare.outputs.component == 'mirakc'
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;$ANDROID_CMAKE_VERSION" >/dev/null
          cmake_bin="$ANDROID_SDK_ROOT/cmake/$ANDROID_CMAKE_VERSION/bin"
          test "$("$cmake_bin/cmake" --version | sed -n '1s/^cmake version \([0-9][0-9.]*\).*/\1/p')" = "$ANDROID_CMAKE_VERSION"
          test "$("$cmake_bin/ninja" --version)" = "1.10.2"
          echo "$cmake_bin" >> "$GITHUB_PATH"
      - name: Install Rust Android targets
        if: needs.prepare.outputs.component == 'mirakc'
        run: |
          set -euo pipefail
          rustup show active-toolchain | grep -E "^${RUST_VERSION}(-|$)"
          rustup target add --toolchain "$RUST_VERSION" armv7-linux-androideabi aarch64-linux-android
          rustc --version | grep -E "^rustc ${RUST_VERSION} "
          cargo --version | grep -E "^cargo ${RUST_VERSION} "
      - name: Cache portable aribb24 host tools
        if: needs.prepare.outputs.component == 'mirakc'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mirakc-arib-tools
          key: mirakc-arib-autotools-${{ runner.os }}-${{ hashFiles('tools/mirakc-arib/bootstrap-autotools.sh') }}
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "The KEYSTORE_BASE64 secret is not set; refusing to ship an unsigned APK" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build and verify
        env:
          MIRAKC_ARIB_AUTOTOOLS_ROOT: ${{ runner.temp }}/mirakc-arib-tools
          CARGO_HOME: ${{ runner.temp }}/cargo
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          COMPONENT: ${{ needs.prepare.outputs.component }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$COMPONENT" == mirakc ]]; then
            ./gradlew --no-daemon \
              -PsianoUserlandDir="$GITHUB_WORKSPACE/siano-userland" \
              -Ppx4UserlandDir="$GITHUB_WORKSPACE/px4-userland" \
              -Ppx4DrvDir="$GITHUB_WORKSPACE/px4_drv" \
              :mirakc:assembleRelease
            apk=mirakc/build/outputs/apk/release/mirakc-release.apk
          else
            ./gradlew --no-daemon :epgstation-server:assembleRelease
            apk=epgstation-server/build/outputs/apk/release/epgstation-server-release.apk
          fi
          python3 tools/scripts/release_version.py check --component "$COMPONENT" --tag "$TAG" --apk "$apk"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk"
          if [[ "$COMPONENT" == mirakc ]]; then
            cert_sha256="$("$apksigner" verify --print-certs "$apk" \
              | awk -F': ' '/certificate SHA-256 digest/ { print $NF; exit }')"
            expected_cert_sha256=1fd02c94f29a5756ed1d560ac4ecb6813fa0b2e634473a6f31da210ffd5223c4
            [[ "${#expected_cert_sha256}" -eq 64 ]] \
              || { echo "Internal error: expected mirakc certificate fingerprint is not 64 hex characters" >&2; exit 1; }
            [[ "$cert_sha256" == "$expected_cert_sha256" ]] \
              || { echo "Unexpected mirakc signing certificate: $cert_sha256" >&2; exit 1; }
          fi
          mkdir -p out
          cp "$apk" "out/${COMPONENT}-${TAG#*-v}.apk"
          (cd out && sha256sum "${COMPONENT}-${TAG#*-v}.apk" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ needs.prepare.outputs.component }}
          path: out/*

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ needs.prepare.outputs.component }}
          path: dist
      - name: Confirm the artifact name carries the release version
        env:
          COMPONENT: ${{ needs.prepare.outputs.component }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          apk="dist/${COMPONENT}-${VERSION}.apk"
          [[ -f "$apk" ]] || { echo "Missing expected artifact: $apk" >&2; exit 1; }
          [[ -f dist/SHA256SUMS ]] || { echo "Missing SHA256SUMS" >&2; exit 1; }
          ls -l dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            dist/*.apk dist/SHA256SUMS
