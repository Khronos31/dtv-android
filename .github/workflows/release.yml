name: Release

on:
  push:
    tags:
      - "epgstation-server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact component release tag (mirakc-v0.3.0 or epgstation-server-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: dtv-android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NDK_VERSION: "27.0.12077973"
  JAVA_VERSION: "17"
  JAVA_RUNTIME_VERSION: "17.0.20.1+1"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Validate release tag and attestation
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      component: ${{ steps.prepare.outputs.component }}
      version: ${{ steps.prepare.outputs.version }}
      tag_target: ${{ steps.prepare.outputs.tag_target }}
      candidate_run_id: ${{ steps.prepare.outputs.candidate_run_id }}
      candidate_git_head: ${{ steps.prepare.outputs.candidate_git_head }}
      candidate_apk_sha256: ${{ steps.prepare.outputs.candidate_apk_sha256 }}
      device_receipt_manifest_sha256: ${{ steps.prepare.outputs.device_receipt_manifest_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate tag, module version, and annotated mirakc attestation
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          case "$tag" in
            mirakc-v*) component=mirakc; version="${tag#mirakc-v}" ;;
            epgstation-server-v*) component=epgstation-server; version="${tag#epgstation-server-v}" ;;
            *) echo "Unsupported release tag: $tag" >&2; exit 1 ;;
          esac
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must end in a semantic version" >&2; exit 1;
          }
          python3 tools/scripts/release_version.py check --component "$component" --tag "$tag"
          git fetch --force origin --tags
          tag_type="$(git cat-file -t "refs/tags/$tag")"
          tag_target="$(git rev-parse "refs/tags/$tag^{commit}")"
          if [[ "$component" == mirakc ]]; then
            [[ "$tag_type" == tag ]] || { echo "mirakc release tags must be annotated" >&2; exit 1; }
            [[ "$version" == 0.3.0 && "$(cat mirakc/VERSION)" == 0.3.0 ]] || {
              echo "mirakc promotion is only defined for version 0.3.0" >&2; exit 1;
            }
            git for-each-ref --format='%(contents)' "refs/tags/$tag" > "$RUNNER_TEMP/mirakc-attestation.txt"
            parsed="$(python3 tools/mirakc/release-attestation.py parse --message "$RUNNER_TEMP/mirakc-attestation.txt")"
            jq -e --arg head "$tag_target" '.candidate_git_head == $head' <<<"$parsed" >/dev/null || {
              echo "tag target does not equal candidate_git_head" >&2; exit 1;
            }
            for field in candidate_run_id candidate_git_head candidate_apk_sha256 device_receipt_manifest_sha256; do
              jq -e --arg field "$field" '.[$field] | strings | length > 0' <<<"$parsed" >/dev/null
            done
          else
            [[ "$tag_type" == tag || "$tag_type" == commit ]] || { echo "invalid EPGStation tag" >&2; exit 1; }
          fi
          previous="$(git tag --list "${component}-v*" --sort=-version:refname \
            | grep -E "^${component}-v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$" \
            | grep -Fxv "$tag" | head -n 1 || true)"
          if [[ -n "$previous" ]]; then
            previous_version="${previous#"$component-v"}"
            newest="$(printf '%s\n%s\n' "$previous_version" "$version" | sort -V | tail -n 1)"
            [[ "$newest" == "$version" ]] || { echo "$tag is not newer than $previous" >&2; exit 1; }
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $tag" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "component=$component"
            echo "version=$version"
            echo "tag_target=$tag_target"
            if [[ "$component" == mirakc ]]; then
              jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$parsed"
            fi
          } >> "$GITHUB_OUTPUT"

  epgstation-build:
    name: Build EPGStation APK
    if: needs.prepare.outputs.component == 'epgstation-server'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Verify exact JDK runtime
        run: |
          set -euo pipefail
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          test "$runtime_version" = "$JAVA_RUNTIME_VERSION"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and verify EPGStation
        env:
          COMPONENT: epgstation-server
          TAG: ${{ needs.prepare.outputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "The KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          sudo apt-get update
          sudo apt-get install -y patchelf
          ./gradlew --no-daemon :epgstation-server:assembleRelease
          apk=epgstation-server/build/outputs/apk/release/epgstation-server-release.apk
          python3 tools/scripts/release_version.py check --component "$COMPONENT" --tag "$TAG" --apk "$apk"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$apk"
          mkdir -p out
          cp "$apk" "out/${COMPONENT}-${TAG#*-v}.apk"
          (cd out && sha256sum "${COMPONENT}-${TAG#*-v}.apk" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: apk-epgstation-server
          path: out/*

  mirakc-promote:
    name: Promote exact signed mirakc candidate
    if: needs.prepare.outputs.component == 'mirakc'
    needs: prepare
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_TARGET: ${{ needs.prepare.outputs.tag_target }}
      CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag_target }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify exact successful signed-candidate run and artifact
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          jq -e --arg head "$TAG_TARGET" \
            '.path == ".github/workflows/signed-candidate.yml" and .event == "workflow_dispatch" and .conclusion == "success" and .head_sha == $head' \
            <<<"$run_json" >/dev/null
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/mirakc-attestation.txt"
          rm -rf artifact
          mkdir artifact
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name mirakc-signed-candidate --dir artifact
          python3 tools/mirakc/verify-release-artifact.py artifact --expected-head "$TAG_TARGET" --expected-run "$CANDIDATE_RUN_ID"
      - name: Verify APKs, source metadata, and annotated acceptance
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_apk_sha256 }}
          EXPECTED_DEVICE_MANIFEST: ${{ needs.prepare.outputs.device_receipt_manifest_sha256 }}
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$sdkroot"
          aapt2="$(find "$sdkroot/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt2 -print | sort -V | tail -n 1)"
          apksigner="$(find "$sdkroot/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$aapt2" -a -x "$apksigner"
          candidate_metadata="$($aapt2 dump badging artifact/mirakc-signed-candidate.apk | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p")"
          test "$candidate_metadata" = "dev.khronos31.mirakc 300 0.3.0"
          candidate_cert="$($apksigner verify --print-certs artifact/mirakc-signed-candidate.apk | awk -F': ' '/certificate SHA-256 digest/ { print $NF; exit }' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$candidate_cert" = "1fd02c94f29a5756ed1d560ac4ecb6813fa0b2e634473a6f31da210ffd5223c4"
          tools/mirakc/audit-apk.sh artifact/mirakc-signed-candidate.apk "$TAG_TARGET"
          python3 tools/mirakc/release-attestation.py acceptance \
            --message "$RUNNER_TEMP/mirakc-attestation.txt" > acceptance.json
          jq -e --arg c "$EXPECTED_CANDIDATE_SHA" --arg d "$EXPECTED_DEVICE_MANIFEST" \
            '.schema == 1 and .kind == "mirakc-release-acceptance" and .candidate_apk_sha256 == $c and .device_receipt_manifest_sha256 == $d' \
            acceptance.json >/dev/null
          mkdir -p out
          cp artifact/mirakc-signed-candidate.apk out/mirakc-0.3.0.apk
          cp acceptance.json out/mirakc-0.3.0-acceptance.json
          sha256sum out/mirakc-0.3.0.apk out/mirakc-0.3.0-acceptance.json > out/SHA256SUMS
          test "$(sha256sum out/mirakc-0.3.0.apk | cut -d' ' -f1)" = "$EXPECTED_CANDIDATE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-mirakc
          path: out/*

  publish:
    name: Publish GitHub Release
    needs: [prepare, epgstation-build, mirakc-promote]
    if: always() && needs.prepare.result == 'success' && ((needs.prepare.outputs.component == 'epgstation-server' && needs.epgstation-build.result == 'success') || (needs.prepare.outputs.component == 'mirakc' && needs.mirakc-promote.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ needs.prepare.outputs.component }}
          path: dist
      - name: Confirm exact release inventory
        env:
          COMPONENT: ${{ needs.prepare.outputs.component }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$COMPONENT" == mirakc ]]; then
            wanted='SHA256SUMS mirakc-0.3.0-acceptance.json mirakc-0.3.0.apk'
          else
            wanted="$(printf '%s\n' "${COMPONENT}-${VERSION}.apk" SHA256SUMS | sort | tr '\n' ' ' | sed 's/ $//')"
          fi
          actual="$(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$actual" = "$wanted"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          COMPONENT: ${{ needs.prepare.outputs.component }}
        run: |
          set -euo pipefail
          if [[ "$COMPONENT" == mirakc ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG" \
              dist/mirakc-0.3.0.apk dist/mirakc-0.3.0-acceptance.json dist/SHA256SUMS
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG" \
              "dist/${COMPONENT}-${{ needs.prepare.outputs.version }}.apk" dist/SHA256SUMS
          fi
