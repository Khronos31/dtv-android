name: Release

on:
  push:
    tags:
      - "mirakc-v*"
      - "epgstation-server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact component release tag (for example, mirakc-v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dtv-android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NDK_VERSION: "27.0.12077973"
  SIANO_USERLAND_REF: v0.1.1
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      component: ${{ steps.prepare.outputs.component }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate tag and module version
        id: prepare
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          case "$tag" in
            mirakc-v*) component=mirakc; version="${tag#mirakc-v}" ;;
            epgstation-server-v*) component=epgstation-server; version="${tag#epgstation-server-v}" ;;
            *) echo "Unsupported release tag: $tag" >&2; exit 1 ;;
          esac
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must end in a semantic version" >&2
            exit 1
          fi
          python3 tools/scripts/release_version.py check --component "$component" --tag "$tag"

          git fetch --force origin --tags
          previous="$(git tag --list "${component}-v*" --sort=-version:refname \
            | grep -E "^${component}-v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$" \
            | grep -Fxv "$tag" | head -n 1 || true)"
          if [[ -n "$previous" ]]; then
            previous_version="${previous#${component}-v}"
            newest="$(printf '%s\n%s\n' "$previous_version" "$version" | sort -V | tail -n 1)"
            if [[ "$newest" != "$version" ]]; then
              echo "$tag is not newer than $previous" >&2
              exit 1
            fi
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $tag" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "component=$component"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.prepare.outputs.component }} APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/checkout@v5
        if: needs.prepare.outputs.component == 'mirakc'
        with:
          repository: Khronos31/siano-userland
          ref: ${{ env.SIANO_USERLAND_REF }}
          path: siano-userland
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v5
        if: needs.prepare.outputs.component == 'epgstation-server'
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Host tools for EPGStation
        if: needs.prepare.outputs.component == 'epgstation-server'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 20) \
            | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "The KEYSTORE_BASE64 secret is not set; refusing to ship an unsigned APK" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build and verify
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          COMPONENT: ${{ needs.prepare.outputs.component }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$COMPONENT" == mirakc ]]; then
            ./gradlew --no-daemon -PsianoUserlandDir="$GITHUB_WORKSPACE/siano-userland" :mirakc:assembleRelease
            apk=mirakc/build/outputs/apk/release/mirakc-release.apk
          else
            ./gradlew --no-daemon :epgstation-server:assembleRelease
            apk=epgstation-server/build/outputs/apk/release/epgstation-server-release.apk
          fi
          python3 tools/scripts/release_version.py check --component "$COMPONENT" --tag "$TAG" --apk "$apk"
          apksigner="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk"
          mkdir -p out
          cp "$apk" "out/${COMPONENT}-${TAG#*-v}.apk"
          (cd out && sha256sum "${COMPONENT}-${TAG#*-v}.apk" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ needs.prepare.outputs.component }}
          path: out/*

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ needs.prepare.outputs.component }}
          path: dist
      - name: Confirm the artifact name carries the release version
        env:
          COMPONENT: ${{ needs.prepare.outputs.component }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          apk="dist/${COMPONENT}-${VERSION}.apk"
          [[ -f "$apk" ]] || { echo "Missing expected artifact: $apk" >&2; exit 1; }
          [[ -f dist/SHA256SUMS ]] || { echo "Missing SHA256SUMS" >&2; exit 1; }
          ls -l dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            dist/*.apk dist/SHA256SUMS
